# Sample configuration file for the PSM classic controllers

controller_manager:
    ros__parameters:
        use_sim_time: true
        update_rate: 100
        joint_state_broadcaster:
            type: joint_state_broadcaster/JointStateBroadcaster
        forward_position_controller:
            type: position_controllers/JointGroupPositionController
forward_position_controller:
    ros__parameters:
        joints:
            - PSM_outer_yaw
            - PSM_pitch
            - PSM_outer_insertion
            - PSM_outer_roll
            - PSM_outer_wrist_pitch
            - PSM_outer_wrist_yaw
            - PSM_jaw
        interface_name: position
