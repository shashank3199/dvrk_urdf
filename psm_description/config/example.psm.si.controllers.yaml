controller_manager:
  ros__parameters:
    use_sim_time: true
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    forward_position_controller:
      type: position_controllers/JointGroupPositionController
forward_position_controller:
  ros__parameters:
    joints:
    - PSM_yaw
    - PSM_pitch
    - PSM_insertion
    - PSM_roll
    - PSM_wrist_pitch
    - PSM_wrist_yaw
    - PSM_jaw
    interface_name: position
