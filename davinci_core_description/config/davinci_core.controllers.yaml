# controllers.yaml

controller_manager:
    ros__parameters:
        use_sim_time: true
        update_rate: 100

        joint_state_broadcaster:
            type: joint_state_broadcaster/JointStateBroadcaster

        forward_position_controller:
            type: position_controllers/JointGroupPositionController

forward_position_controller:
    ros__parameters:
        joints:
            - left_arm_outer_yaw_joint
            - left_arm_outer_pitch_base_joint
            - left_arm_outer_pitch_front_joint
            - left_arm_outer_pitch_bottom_joint
            - left_arm_outer_pitch_top_joint
            - left_arm_outer_insertion_joint
            - left_arm_tool_insertion_joint
            - right_arm_outer_yaw_joint
            - right_arm_outer_pitch_base_joint
            - right_arm_outer_pitch_front_joint
            - right_arm_outer_pitch_bottom_joint
            - right_arm_outer_pitch_top_joint
            - right_arm_outer_insertion_joint
            - right_arm_tool_insertion_joint
        interface_name: position
